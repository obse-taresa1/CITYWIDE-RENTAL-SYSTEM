<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Item Details - CityRent</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body id="top" data-public-shell="true">
    <main class="container page-header pb-5">
      <div id="item-loading" class="row g-4">
        <div class="col-lg-7">
          <div class="details-skeleton skeleton-gallery"></div>
          <div class="d-flex gap-2 mt-3">
            <div class="details-skeleton skeleton-thumb"></div>
            <div class="details-skeleton skeleton-thumb"></div>
            <div class="details-skeleton skeleton-thumb"></div>
            <div class="details-skeleton skeleton-thumb"></div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="card card-custom p-4">
            <div class="details-skeleton skeleton-line w-75"></div>
            <div class="details-skeleton skeleton-line w-50"></div>
            <div class="details-skeleton skeleton-line w-25"></div>
            <div class="details-skeleton skeleton-block"></div>
          </div>
        </div>
      </div>

      <div id="item-error" class="card card-custom p-4" hidden>
        <h1 class="h4">Item not found</h1>
        <p class="text-muted mb-3">
          We could not find this rental item. Please return to the listings and
          choose another item.
        </p>
        <a href="items.html" class="btn btn-primary-custom">Browse Items</a>
      </div>

      <div id="item-content" class="row g-4" hidden>
        <div class="col-lg-7">
          <div class="item-gallery">
            <div class="gallery-stage">
              <img id="item-image" src="" alt="" class="gal-img d-block" />
            </div>
            <div id="item-thumbnails" class="gallery-thumbs"></div>
          </div>
        </div>

        <div class="col-lg-5">
          <div class="card card-custom p-4">
            <h1 id="item-title" class="h3"></h1>
            <p id="item-rating" class="item-rating mb-2"></p>
            <p class="display-6 text-primary-custom mb-3">
              <span id="item-price"></span>
              <small class="fs-6 text-muted fw-normal">/ day</small>
            </p>
            <p id="item-description"></p>
            <hr />
            <p id="auth-message" class="auth-rent-message" hidden>
              Please sign in to continue renting.
            </p>
            <button
              id="rent-now-btn"
              type="button"
              class="btn btn-primary-custom w-100"
              disabled
            >
              Checking availability...
            </button>
          </div>

          <div class="card card-custom p-4 mt-3">
            <h6>
              <i class="bi bi-shield-check text-accent-custom"></i>
              Rental Protection
            </h6>
            <p id="rental-protection" class="small text-muted mb-0"></p>
          </div>

          <section data-item-reviews></section>
        </div>
      </div>
    </main>

    <a href="#top" id="back-to-top" aria-label="Back to top"
      ><i class="bi bi-arrow-up"></i
    ></a>

    <script src="components/rating-widget.js"></script>
    <script src="components/review-modal.js"></script>
    <script src="js/rent-access.js"></script>
    <script src="js/item-details.js"></script>
    <script src="js/shared-ui.js"></script>
  </body>
</html>
