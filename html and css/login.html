<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — CityRent</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <input
      type="checkbox"
      id="theme-toggle"
      class="theme-check"
      aria-label="Toggle dark mode"
    />

    <div class="top-bar">
      <div class="container">
        <div class="top-bar-flex">
          <span><i class="bi bi-telephone-fill"></i> (+1) 800-555-1234</span>
          <div class="top-bar-social">
            <a href="#"><i class="bi bi-facebook"></i></a>
            <a href="#"><i class="bi bi-instagram"></i></a>
          </div>
        </div>
      </div>
    </div>
    <header class="motorx-header">
      <div class="container">
        <div class="motorx-nav-flex">
          <a class="motorx-logo" href="index.html"
            ><img
              src="images/logo.png"
              alt="CityRent Logo"
              style="height: 50px"
          /></a>
          <a href="index.html" class="nav-login ms-auto">← Back to Home</a>
        </div>
      </div>
    </header>

    <main class="auth-page" style="padding-top: 2rem">
      <div class="auth-card">
        <div class="text-center mb-4">
          <h2>Welcome Back</h2>
          <p class="text-muted">Sign in to your account</p>
        </div>
        <form action="dashboard.html" method="get">
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="you@example.com"
              pattern="[^@\s]+@[^@\s]+\.[^@\s]+"
              required
            />
            <div class="form-text">
              Use a valid email address like user@example.com.
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="••••••••"
              minlength="8"
              required
            />
            <div class="form-text">
              Password must be at least 8 characters long.
            </div>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" />
              <label class="form-check-label" for="remember">Remember Me</label>
            </div>
            <a href="#" class="small text-primary-custom">Forgot Password?</a>
          </div>
          <button type="submit" class="btn btn-primary-custom w-100 mb-3">
            Login
          </button>
          <a href="register.html" class="btn btn-outline-custom w-100"
            >Register</a
          >
        </form>
        <p class="text-center text-muted small mt-4 mb-0">
          Don't have an account?
          <a href="register.html" class="text-primary-custom">Sign up</a>
        </p>
      </div>
    </main>
  </body>
</html>
