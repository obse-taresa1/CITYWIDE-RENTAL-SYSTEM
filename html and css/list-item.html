<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List Your Item — CityRent</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body id="top" data-dashboard-shell="lessor">
  <input type="checkbox" id="theme-toggle" class="theme-check" aria-label="Toggle dark mode">

  <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-box-seam-fill"></i> CityRent</a>
      <div class="navbar-actions ms-auto">
        <label for="theme-toggle" class="theme-toggle">
          <i class="bi bi-moon-fill icon-dark"></i>
          <i class="bi bi-sun-fill icon-light"></i>
        </label>
        <a href="dashboard.html" class="btn btn-sm btn-outline-custom">Dashboard</a>
      </div>
    </div>
  </nav>

  <header class="page-header">
    <div class="container">
      <h1>List Your Item</h1>
      <p class="text-muted">Share your item with renters across the city</p>
    </div>
  </header>

  <main class="container pb-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card card-custom p-4 p-md-5">
          <form action="dashboard.html" method="get" data-listing-form>
            <div class="mb-3">
              <label class="form-label" for="item-name">Item Name</label>
              <input type="text" class="form-control" id="item-name" placeholder="e.g. Canon EOS DSLR Kit" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="category">Category</label>
              <select class="form-select" id="category" required>
                <option value="">Select category</option>
                <option>Electronics</option>
                <option>Tools</option>
                <option>Cameras</option>
                <option>Vehicles</option>
                <option>Medical Equipment</option>
                <option>Event Supplies</option>
                <option>Sports Equipment</option>
                <option>Furniture</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label" for="description">Description</label>
              <textarea class="form-control" id="description" rows="4" placeholder="Describe condition, included accessories, rules..." required></textarea>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label" for="price">Price Per Day ($)</label>
                <input type="number" class="form-control" id="price" min="1" step="0.01" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label" for="deposit">Security Deposit ($)</label>
                <input type="number" class="form-control" id="deposit" min="0" step="0.01" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="images">Upload Images</label>
              <input type="file" class="form-control" id="images" accept="image/*" multiple>
              <small class="text-muted">Add up to 8 photos. First image is the cover.</small>
            </div>
            <div class="mb-3">
              <label class="form-label" for="location">Location</label>
              <input type="text" class="form-control" id="location" placeholder="Neighborhood or pickup address" required>
            </div>
            <div class="mb-4">
              <label class="form-label" for="availability">Availability Calendar</label>
              <input type="date" class="form-control mb-2" id="avail-start" aria-label="Available from">
              <input type="date" class="form-control" id="avail-end" aria-label="Available until">
              <small class="text-muted">Set the date range when your item is available for rent.</small>
            </div>
            <button type="submit" class="btn btn-primary-custom btn-lg w-100">Publish Listing</button>
            <p class="small mt-3 mb-0" data-listing-message></p>
          </form>
        </div>
      </div>
    </div>
  </main>

  <a href="#top" id="back-to-top" aria-label="Back to top"><i class="bi bi-arrow-up"></i></a>
    <script src="js/listing-system.js"></script>
    <script src="js/shared-ui.js"></script>
  </body>
</html>
