<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — CityRent</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <input type="checkbox" id="theme-toggle" class="theme-check" aria-label="Toggle dark mode">

  <nav class="navbar navbar-custom fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-box-seam-fill"></i> CityRent</a>
      <label for="theme-toggle" class="theme-toggle ms-auto">
        <i class="bi bi-moon-fill icon-dark"></i>
        <i class="bi bi-sun-fill icon-light"></i>
      </label>
    </div>
  </nav>

  <main class="auth-page">
    <div class="auth-card" style="max-width: 480px;">
      <div class="text-center mb-4">
        <h2>Create Account</h2>
        <p class="text-muted">Join the citywide rental community</p>
      </div>
      <form action="dashboard.html" method="get">
        <div class="mb-3">
          <label class="form-label" for="fullname">Full Name</label>
          <input type="text" class="form-control" id="fullname" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="phone">Phone Number</label>
          <input type="tel" class="form-control" id="phone" placeholder="+1 (555) 000-0000" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-control" id="password" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="confirm">Confirm Password</label>
          <input type="password" class="form-control" id="confirm" required>
        </div>
        <div class="mb-4">
          <label class="form-label d-block mb-2">I want to register as</label>
          <div class="role-selector">
            <label class="role-option">
              <input type="radio" name="role" value="lessor" checked>
              <i class="bi bi-shop d-block fs-4 mb-1"></i>
              <strong>Lessor</strong>
              <small class="d-block text-muted">List items</small>
            </label>
            <label class="role-option">
              <input type="radio" name="role" value="lessee">
              <i class="bi bi-bag-check d-block fs-4 mb-1"></i>
              <strong>Lessee</strong>
              <small class="d-block text-muted">Rent items</small>
            </label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary-custom w-100">Create Account</button>
      </form>
      <p class="text-center text-muted small mt-4 mb-0">
        Already have an account? <a href="login.html" class="text-primary-custom">Login</a>
      </p>
    </div>
  </main>

</body>
</html>
